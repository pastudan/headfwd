<svg viewBox="0 24 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-default-dark-title architecture-default-dark-desc" id="architecture-default-dark-root">
      <title id="architecture-default-dark-title">HeadFwd architecture</title>
      <desc id="architecture-default-dark-desc">Headscale, the HeadFwd sidecar and your app run behind NAT and can ship as a single app. The sidecar dials out a persistent WSS tunnel to an untrusted HeadFwd proxy. Clients open their own WSS tunnel to the proxy at their fingerprint subdomain, and the proxy splices it into the sidecar's tunnel; the control traffic inside is Noise-encrypted end to end, so only Headscale can read it. Devices then reach your app over a secure direct WireGuard channel. Optionally, your app can call the sidecar's user and device management API, so onboarding lives in your app's own UI.</desc>
