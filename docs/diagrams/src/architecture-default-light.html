    <h1>Reaching a Headscale server behind NAT</h1>

      <title id="architecture-default-light-title">HeadFwd architecture</title>
      <desc id="architecture-default-light-desc">Headscale, the HeadFwd sidecar and your app run behind NAT and can ship as a single app. The sidecar dials out a persistent WSS tunnel to an untrusted HeadFwd proxy. Clients open their own WSS tunnel to the proxy at their fingerprint subdomain, and the proxy splices it into the sidecar's tunnel; the control traffic inside is Noise-encrypted end to end, so only Headscale can read it. Devices then reach your app over a secure direct WireGuard channel. Optionally, your app can call the sidecar's user and device management API, so onboarding lives in your app's own UI.</desc>
