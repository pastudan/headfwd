# Headscale configuration for HeadFwd development

server_url: https://a1b2c3d4e5f60718293a4b5c6d7e8f90.headfwd.net

# Listen address for gRPC and HTTP
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090

# gRPC API configuration
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: true

# Private key for Headscale server
private_key_path: /var/lib/headscale/private.key

# Noise protocol for secure communication
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# IP prefixes for the Tailscale network
prefixes:
  v4: 100.64.0.0/10 # Standard Tailscale CGNAT range
  v6: fd7a:115c:a1e0::/48 # IPv6 range

# DERP configuration (relay servers)
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "local"
    region_name: "Local DERP"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key

  # Use local DERP server
  urls: []

  # Custom DERP map
  paths: []

  auto_update_enabled: false

# Database
database:
  type: sqlite3
  sqlite:
    path: /var/lib/headscale/db.sqlite

# Disable ephemeral nodes (keep nodes registered)
ephemeral_node_inactivity_timeout: 30m

# DNS configuration
dns:
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8

  # MagicDNS - .ts.net domains
  magic_dns: true
  base_domain: headfwd.local

  search_domains: []

# Logging
log:
  level: info
  format: text

# Disable ACLs for development (allow all traffic)

# Unix socket for CLI
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

# Disable TLS for local development
tls_cert_path: ""
tls_key_path: ""

# Policy configuration
policy:
  mode: file
  path: ""
