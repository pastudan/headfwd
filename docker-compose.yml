version: "3.8"

services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    ports:
      - "8080:8080" # HTTP API
      - "9090:9090" # Metrics
      - "3478:3478/udp" # STUN
    volumes:
      - ./headscale/config:/etc/headscale
      - ./headscale/data:/var/lib/headscale
    command: serve
    environment:
      - TZ=UTC

  # HeadFwd sidecar - establishes reverse tunnel
  headfwd-sidecar:
    build: ./headfwd-sidecar
    container_name: headfwd-sidecar
    restart: unless-stopped
    environment:
      AUTO_REGISTER: ${AUTO_REGISTER:-true}
      RESTART_HEADSCALE: ${RESTART_HEADSCALE:-false}
      HEADSCALE_CONTAINER_NAME: ${HEADSCALE_CONTAINER_NAME:-headscale}
    volumes:
      # Mount Headscale data directory for access to Noise private key
      - ./headscale/data:/keys:ro
      - ./headscale/config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - headscale

  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: headplane
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./headplane/config/config.yaml:/etc/headplane/config.yaml
      - ./headplane/data:/var/lib/headplane
      - ./headscale/config/config.yaml:/etc/headscale/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - headscale
