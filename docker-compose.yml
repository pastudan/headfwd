version: "3.8"

services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    ports:
      - "8080:8080" # HTTP API
      - "9090:9090" # Metrics
      - "3478:3478/udp" # STUN
    volumes:
      - ./headscale/config:/etc/headscale
      - ./headscale/data:/var/lib/headscale
    command: serve
    environment:
      - TZ=UTC

  # HeadFwd sidecar - establishes reverse tunnel
  headfwd-sidecar:
    build: ./headfwd-sidecar
    container_name: headfwd-sidecar
    restart: unless-stopped
    environment:
      AUTO_REGISTER: ${AUTO_REGISTER:-true}
    volumes:
      # Mount Headscale data directory for access to Noise private key
      - ./headscale/data:/keys:ro
      - ./headscale/config:/config
    depends_on:
      - headscale
