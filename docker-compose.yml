version: "3.8"

services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    ports:
      - "8080:8080" # HTTP API
      - "9090:9090" # Metrics
      - "3478:3478/udp" # STUN
    volumes:
      - ./headscale/config:/etc/headscale
      - ./headscale/data:/var/lib/headscale
    command: serve
    environment:
      - TZ=UTC

  # HeadFwd sidecar - reverse tunnel + optional admin portal
  headfwd-sidecar:
    build: ./headfwd-sidecar
    container_name: headfwd-sidecar
    restart: unless-stopped
    ports:
      - "3001:3001" # Portal web UI (when PORTAL_ENABLED=true)
    environment:
      AUTO_REGISTER: ${AUTO_REGISTER:-true}
      RESTART_HEADSCALE: ${RESTART_HEADSCALE:-false}
      HEADSCALE_CONTAINER_NAME: ${HEADSCALE_CONTAINER_NAME:-headscale}
      PORTAL_ENABLED: ${PORTAL_ENABLED:-true}
      PORTAL_PORT: ${PORTAL_PORT:-3001}
      # HEADSCALE_API_KEY is auto-bootstrapped via docker exec if not set
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      # UPSTREAM_URL: when set, proxies all non-/api/* traffic to this backend
      # and injects X-Tailscale-{User,Login,Device,IP} identity headers.
      # Examples: http://frigate:5000  http://localhost:5173
      UPSTREAM_URL: ${UPSTREAM_URL:-}
    volumes:
      - ./headscale/data:/keys:ro
      - ./headscale/config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - headfwd-tsnet:/var/lib/headfwd-ts # persistent tsnet node keypair
    depends_on:
      - headscale

volumes:
  headfwd-tsnet: # persistent storage for tsnet WireGuard keypair
